# -----------------------------------------------------------------------------
# EXAMPLE — sanitized, educational.
#
# Drop-in, not an edit of the unit file:
#   /etc/systemd/system/agent-gateway.service.d/override.conf
#
# Drop-ins keep the vendor/base unit intact, survive package updates, and make
# the local delta obvious in a diff. Editing the base unit hides the change.
#
# Apply with: sudo systemctl daemon-reload && sudo systemctl restart agent-gateway
# Verify with: systemctl cat agent-gateway.service   (shows base + all drop-ins)
# -----------------------------------------------------------------------------
[Service]
# Files created by the service default to no group-write and no world access.
UMask=0027
