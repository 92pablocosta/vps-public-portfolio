# -----------------------------------------------------------------------------
# EXAMPLE — sanitized, educational. Not a production file.
#
# Monitoring platform behind the reverse proxy. No host port published.
#
# Structural caveat worth stating in the file itself: this monitor runs on the
# host it watches. It cannot alert on its own outage or on total host loss.
# Independent off-host monitoring is a planned improvement, not an implemented
# control.
# -----------------------------------------------------------------------------
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.3.2      # pinned version, never :latest
    container_name: uptime-kuma
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    volumes:
      # BACKUP-CRITICAL: SQLite database in WAL mode plus its -wal/-shm
      # sidecars. At inspection the WAL was larger than the database itself,
      # so a plain copy of the .db during writes is not a backup.
      - uptime_kuma_data:/app/data

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_KUMA_DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

volumes:
  uptime_kuma_data:

networks:
  proxy:
    external: true

# Monitor configuration note (applies to the check that watches this UI):
#   GET /            -> 302, Location: /dashboard
#   GET / (-L)       -> /dashboard -> 200
#   GET /dashboard   -> 200
#
# The check is only correct while it FOLLOWS redirects. Accepting 200-299
# without following turns a healthy service into a permanent false alarm.
