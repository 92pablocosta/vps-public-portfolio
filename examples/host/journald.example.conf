# -----------------------------------------------------------------------------
# EXAMPLE — sanitized, educational.
#
# Journal retention: /etc/systemd/journald.conf
# Apply with: sudo systemctl restart systemd-journald
# Verify with: journalctl --disk-usage
#
# Why bound it at all: on a small VPS an unbounded journal is a slow-motion
# disk-full outage, and disk-full takes down everything at once — including the
# monitoring that would have told you about it.
#
# The trade-off is explicit: 7 days of retention is enough to investigate a
# recent incident and not enough for long-term forensics. Anything needed beyond
# that window has to be shipped off-host, which is a separate, unimplemented
# piece of work.
# -----------------------------------------------------------------------------
[Journal]
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=7day
MaxFileSec=1day
Compress=yes
