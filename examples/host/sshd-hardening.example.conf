# -----------------------------------------------------------------------------
# EXAMPLE — sanitized, educational.
#
# SSH hardening as a DROP-IN, not an edit of the distribution's sshd_config:
#   /etc/ssh/sshd_config.d/00-hardening.conf
#
# Why a drop-in: the base file is package-managed and will be replaced or
# three-way-merged on upgrade. A drop-in keeps the local policy in one small,
# reviewable file that survives updates and shows up clearly in a diff.
# -----------------------------------------------------------------------------

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

MaxAuthTries 3
LoginGraceTime 30

# -----------------------------------------------------------------------------
# THE IMPORTANT PART IS THE VERIFICATION, NOT THIS FILE.
#
# Ubuntu's stock sshd_config ships an `Include /etc/ssh/sshd_config.d/*.conf`
# near the top AND (in some builds/edited hosts) a `PermitRootLogin` line
# further down. OpenSSH uses the FIRST obtained value for such keywords, so the
# drop-in wins — but "should win" is reasoning, not evidence. On this host the
# two genuinely disagreed, and the disagreement was settled by reading the
# daemon's own effective view:
#
#   sudo sshd -t          # syntax check BEFORE touching the running daemon
#   sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|pubkeyauthentication|maxauthtries|logingracetime) '
#   sudo systemctl reload ssh    # only after BOTH checks pass
#
# Result on this host: permitrootlogin no.
#
# Two operational rules, both learned the safe way:
#   - never reload the daemon that provides your only access path without
#     running `sshd -t` first;
#   - keep a SECOND authenticated session open throughout, and prove a new
#     session works before closing the old one.
#
# Open review item from the audit: the base config explicitly enables
# X11Forwarding, which has no use on a headless server and should be disabled.
# -----------------------------------------------------------------------------
